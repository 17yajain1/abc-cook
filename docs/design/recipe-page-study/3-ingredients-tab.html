<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Recipe page — Ingredients tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A9481A}a:hover{color:#7E3412}
</style>
</head>
<body>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; background: #FBF8F4; color: #23100A; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column;">

  <div style="border-bottom: 1px solid #EADFD3; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 2px;">
      <button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23100A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div style="flex: 1; font-stretch: 75%; font-weight: 700; font-size: 20px;">Sabudana Khichdi</div>
    </div>
    <div style="display: flex; gap: 22px; padding: 0 20px;">
      <button style="background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 6px 0 10px; font: inherit; font-size: 15px; font-weight: 500; color: #6B5A50;">Plan</button>
      <button style="background: none; border: 0; border-bottom: 2px solid #23100A; margin-bottom: -1px; padding: 6px 0 10px; font: inherit; font-size: 15px; font-weight: 600; color: #23100A;">Ingredients <span style="font-variant-numeric: tabular-nums;">14</span></button>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div style="font-size: 15px; font-weight: 600;">Servings</div>
      <div style="font-size: 12px; color: #6B5A50;">Times stay the same</div>
    </div>
    <div style="display: flex; align-items: center; border: 1px solid #EADFD3; border-radius: 999px; background: #FFFFFF;">
      <button aria-label="Fewer servings" style="width: 44px; height: 40px; border: 0; background: none; font: inherit; font-size: 20px; color: #23100A;">−</button>
      <span style="min-width: 22px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">4</span>
      <button aria-label="More servings" style="width: 44px; height: 40px; border: 0; background: none; font: inherit; font-size: 20px; color: #23100A;">+</button>
    </div>
  </div>

  <div style="margin: 14px 20px 0; font-size: 13px; color: #6B5A50;">Tick what you already have. <span style="font-weight: 600; color: #23100A;">9 of 14 ticked</span></div>

  <div style="margin: 14px 0 0; padding: 0 20px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.4px; color: #6B5A50; padding: 6px 0;">FOR THE KHICHDI</div>
    <div style="display: flex; flex-direction: column;">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1;"><span style="display: block; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Sabudana</span><span style="display: block; font-size: 12px; color: #6B5A50;">soaked 2 hr · step 1</span></span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">1 cup</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1;"><span style="display: block; font-size: 15px;">Potatoes</span><span style="display: block; font-size: 12px; color: #6B5A50;">boiled, cubed</span></span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">2 medium</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Raw peanuts</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">¼ cup</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Ghee or cooking oil</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">3 tbsp</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Cumin seeds</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">½ tsp</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px;">Curry leaves</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">12</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1;"><span style="display: block; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Green chillies</span><span style="display: block; font-size: 12px; color: #6B5A50;">2 whole + 1 tbsp chopped</span></span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">3</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Sendha namak</span><span style="font-size: 13px; color: #6B5A50;">to taste</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Sugar</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">½ tsp</span></label>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.4px; color: #6B5A50; padding: 18px 0 6px;">FOR THE GREEN CHUTNEY</div>
    <div style="display: flex; flex-direction: column;">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px;">Coriander leaves</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">½ cup</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Roasted peanuts</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">4 tbsp</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px;">Lemon juice</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">1 tsp</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px;">Ginger</span><span style="font-size: 13px; color: #6B5A50;">½ inch</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #EADFD3;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #AF5428; margin: 0;"><span style="flex: 1; font-size: 15px; color: #6B5A50; text-decoration: line-through;">Curd</span><span style="font-size: 13px; color: #6B5A50; font-variant-numeric: tabular-nums;">2 tbsp</span></label>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #EADFD3; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 44px; border: 1px solid #23100A; border-radius: 999px; background: #FFFFFF; color: #23100A; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#23100A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
      Copy the 5 missing items
    </button>
    <button style="height: 52px; border: 0; border-radius: 999px; background: #AF5428; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600;">Start cooking</button>
  </div>
</div>
</body>
</html>
